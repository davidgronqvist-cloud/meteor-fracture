    function drawShieldHUD() {
      const y = 30;
      const size = 26;
      const spacing = 30;

      if (maxShields > MAX_PLAYER_SHIELDS) {
        const x = canvas.width - 18;
        ctx.save();
        ctx.fillStyle = 'rgba(12, 23, 30, 0.86)';
        ctx.strokeStyle = '#36c9f4';
        ctx.lineWidth = 2;
        if (ctx.roundRect) ctx.roundRect(x - 162, y - 17, 154, 34, 10);
        else ctx.rect(x - 162, y - 17, 154, 34);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#e8faff';
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(`HULL ${shields}/${maxShields}`, x - 16, y);
        ctx.restore();
        return;
      }

      const startX = canvas.width - 40;
      for (let i = 0; i < maxShields; i++) {
        const curX = startX - (maxShields - 1 - i) * spacing;
        ctx.globalAlpha = i < shields ? 1.0 : 0.22;

        if (!safeDrawImage(shieldImg, curX - size / 2, y - size / 2, size, size)) {
          ctx.fillStyle = i < shields ? '#00c3ff' : '#333';
          ctx.beginPath();
          ctx.arc(curX, y, size / 2 - 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1.0;
    }

    function renderSmoke() {
      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        p.life -= p.decay;

        if (p.life <= 0) {
          smokeParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * 0.55;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const size = 64 * p.scale;
        safeDrawImage(p.img, -size / 2, -size / 2, size, size);
        ctx.restore();
      }
    }

    function renderExplosions() {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        const frameIdx = Math.floor(exp.frame);

        if (frameIdx >= 9) {
          explosions.splice(i, 1);
          continue;
        }

        const img = explosionImgs[frameIdx];
        const size = 64 * exp.scale;

        if (!safeDrawImage(img, exp.x - size / 2, exp.y - size / 2, size, size)) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, 1 - (frameIdx / 9));
          ctx.strokeStyle = frameIdx % 2 === 0 ? '#ffcc00' : '#ff3300';
          ctx.lineWidth = 3 * exp.scale;
          ctx.beginPath();
          ctx.arc(exp.x, exp.y, (frameIdx + 1) * 7 * exp.scale, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        exp.frame += 0.45;
      }
    }

    function getDefenseTurretMounts() {
      const scaleX = canvas.width / 800;
      const scaleY = canvas.height / 600;
      return DEFENSE_TURRET_LAYOUT.map((mount) => ({
        x: (mount.x * 1.14 - 55) * scaleX,

      }));
    }

    function getDefenseShipHullPoints() {
      const scaleX = canvas.width / 800;
      const scaleY = canvas.height / 600;
      return [
        [48, 488], [101, 438], [289, 419], [333, 389], [467, 389],
        [511, 419], [699, 438], [752, 488], [750, 518], [50, 518]
      ].map(([x, y]) => ({
        x: (x * 1.14 - 55) * scaleX,
        y: (y * 0.62 + 250) * scaleY
      }));
    }

    function getDefenseShipImpactPoint(x, y) {
      const hull = getDefenseShipHullPoints();
      let nearestPoint = hull[0];
      let minDistanceSquared = Infinity;
      for (let i = 0, j = hull.length - 1; i < hull.length; j = i++) {
        const a = hull[j];
        const b = hull[i];
        const segmentX = b.x - a.x;
        const segmentY = b.y - a.y;
        const segmentLengthSquared = segmentX * segmentX + segmentY * segmentY;
        const projection = segmentLengthSquared === 0
          ? 0
          : Math.max(0, Math.min(1, ((x - a.x) * segmentX + (y - a.y) * segmentY) / segmentLengthSquared));
        const pointX = a.x + projection * segmentX;
        const pointY = a.y + projection * segmentY;
        const dx = x - pointX;
        const dy = y - pointY;
        const distanceSquared = dx * dx + dy * dy;
        if (distanceSquared < minDistanceSquared) {
          minDistanceSquared = distanceSquared;
          nearestPoint = { x: pointX, y: pointY };
        }
      }
      return nearestPoint;
    }

    function defenseShipCollidesCircle(x, y, radius) {
      const centerY = defenseShip.y - canvas.height * 0.1364;
      if (Math.abs(x - defenseShip.x) > defenseShip.collisionHalfWidth + radius ||
        Math.abs(y - centerY) > defenseShip.collisionHalfHeight + radius) {
        return false;
      }

      const hull = getDefenseShipHullPoints();
      let inside = false;
      let minDistanceSquared = Infinity;
      for (let i = 0, j = hull.length - 1; i < hull.length; j = i++) {
        const a = hull[j];
        const b = hull[i];
        if ((a.y > y) !== (b.y > y) &&
          x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) {
          inside = !inside;
        }

        const segmentX = b.x - a.x;
        const segmentY = b.y - a.y;
        const segmentLengthSquared = segmentX * segmentX + segmentY * segmentY;
        const projection = segmentLengthSquared === 0
          ? 0
          : Math.max(0, Math.min(1, ((x - a.x) * segmentX + (y - a.y) * segmentY) / segmentLengthSquared));
        const nearestX = a.x + projection * segmentX;
        const nearestY = a.y + projection * segmentY;
        const dx = x - nearestX;
        const dy = y - nearestY;
        minDistanceSquared = Math.min(minDistanceSquared, dx * dx + dy * dy);
      }
      return inside || minDistanceSquared <= radius * radius;
    }

    function getMeteorImpactTime(meteor) {
      const minX = meteor.radius;
      const horizontalSpan = Math.max(0, canvas.width - meteor.radius * 2);
      const bouncePeriod = horizontalSpan * 2;
      const gravity = meteor.gravity || 0;

      for (let time = 1; time <= 180; time++) {
        const impactY = meteor.y + meteor.vy * time + gravity * time * (time + 1) / 2;
        if (impactY - meteor.radius > canvas.height) return null;

        const travel = meteor.x - minX + meteor.vx * time;
        const positionInBounce = bouncePeriod > 0
          ? ((travel % bouncePeriod) + bouncePeriod) % bouncePeriod
          : 0;
        const impactX = minX + (positionInBounce <= horizontalSpan ? positionInBounce : bouncePeriod - positionInBounce);
        if (defenseShipCollidesCircle(impactX, impactY, meteor.radius)) {
          return { time, impactX };
        }
      }
      return null;
    }

    function updateAutoTurrets(now) {
      defenseShip.x = canvas.width / 2;
      defenseShip.y = canvas.height;

      const targetable = meteors
        .map(meteor => ({ meteor, impact: getMeteorImpactTime(meteor) }))
        .filter((entry) => entry.impact !== null)
        .sort((a, b) => a.impact.time - b.impact.time);
      const reservedDamage = new Map();
      for (const laser of autoTurretLasers) {
        if (meteors.includes(laser.target)) {
          reservedDamage.set(laser.target, (reservedDamage.get(laser.target) || 0) + laser.damage);
        }
      }

      const turretMounts = getDefenseTurretMounts();
      for (let i = 0; i < autoTurretCount; i++) {
        if (now < autoTurretNextFireAt[i] || targetable.length === 0) continue;
        const target = targetable.find(({ meteor }) =>
          meteor.hp - (reservedDamage.get(meteor) || 0) > 0
        );
        if (!target) break;
        const { meteor } = target;
        const mount = turretMounts[i];
        autoTurretLasers.push({
          x: mount.x,
          y: mount.y - canvas.height * 0.037,
          target: meteor,
          damage: bulletDamage,
          speed: 13
        });
        reservedDamage.set(meteor, (reservedDamage.get(meteor) || 0) + bulletDamage);
        autoTurretNextFireAt[i] = now + autoTurretCooldownMs;
        playSound('turretLaser', 0.35);
      }

      for (let i = autoTurretLasers.length - 1; i >= 0; i--) {
        const laser = autoTurretLasers[i];
        if (!meteors.includes(laser.target)) {
          autoTurretLasers.splice(i, 1);
          continue;
        }
        const dx = laser.target.x - laser.x;
        const dy = laser.target.y - laser.y;
        const distance = Math.hypot(dx, dy);
        if (distance <= laser.speed + laser.target.radius) {
          damageMeteorFromShot(laser.target, laser.damage);
          autoTurretLasers.splice(i, 1);
          continue;
        }
        if (!Number.isFinite(distance) || distance === 0) {
          autoTurretLasers.splice(i, 1);
          continue;
        }
        laser.x += dx / distance * laser.speed;
        laser.y += dy / distance * laser.speed;
      }
    }

    function drawDefenseShip(now) {
      defenseShip.x = canvas.width / 2;
      defenseShip.y = canvas.height;
      defenseShip.collisionHalfWidth = canvas.width / 2;
      defenseShip.collisionHalfHeight = canvas.height * 0.0884;

      const drawPart = (partNumber, x, y, width, height) => {
        const image = buildingPartImages.get(partNumber);
        if (image) safeDrawImage(image, x, y, width, height);
      };

      const scaleX = canvas.width / 800;
      const scaleY = canvas.height / 600;
      ctx.save();
      ctx.scale(scaleX, scaleY);
      ctx.translate(-55, 250);
      ctx.scale(1.14, 0.62);

      const hullGradient = ctx.createLinearGradient(0, 389, 0, 518);
      hullGradient.addColorStop(0, '#879ca4');
      hullGradient.addColorStop(0.16, '#415561');
      hullGradient.addColorStop(0.54, '#283a49');
      hullGradient.addColorStop(1, '#111a26');
      const wingGradient = ctx.createLinearGradient(0, 389, 0, 518);
      wingGradient.addColorStop(0, '#a8b8ba');
      wingGradient.addColorStop(0.27, '#546c77');
      wingGradient.addColorStop(1, '#1a2937');

      ctx.shadowColor = 'rgba(50, 190, 255, 0.28)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(48, 488);
      ctx.lineTo(101, 438);
      ctx.lineTo(289, 419);
      ctx.lineTo(333, 389);
      ctx.lineTo(467, 389);
      ctx.lineTo(511, 419);
      ctx.lineTo(699, 438);
      ctx.lineTo(752, 488);
      ctx.lineTo(750, 518);
      ctx.lineTo(50, 518);
      ctx.closePath();
      ctx.fillStyle = wingGradient;
      ctx.strokeStyle = '#c3d5d8';
      ctx.lineWidth = 3;
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = hullGradient;
      ctx.strokeStyle = '#93aab2';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(118, 438);
      ctx.lineTo(285, 423);
      ctx.lineTo(318, 441);
      ctx.lineTo(282, 479);
      ctx.lineTo(98, 482);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(682, 438);
      ctx.lineTo(515, 423);
      ctx.lineTo(482, 441);
      ctx.lineTo(518, 479);
      ctx.lineTo(702, 482);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(287, 427);
      ctx.lineTo(335, 399);
      ctx.lineTo(465, 399);
      ctx.lineTo(513, 427);
      ctx.lineTo(484, 489);
      ctx.lineTo(316, 489);
      ctx.closePath();
      ctx.fillStyle = hullGradient;
      ctx.strokeStyle = '#c3d4d7';
      ctx.lineWidth = 3;
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(335, 399);
      ctx.lineTo(365, 369);
      ctx.lineTo(435, 369);
      ctx.lineTo(465, 399);
      ctx.lineTo(451, 430);
      ctx.lineTo(349, 430);
      ctx.closePath();
      ctx.fillStyle = '#526b76';
      ctx.strokeStyle = '#c2d5d9';
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(365, 370);
      ctx.lineTo(380, 351);
      ctx.lineTo(420, 351);
      ctx.lineTo(435, 370);
      ctx.lineTo(425, 397);
      ctx.lineTo(375, 397);
      ctx.closePath();
      ctx.fillStyle = '#8fa5aa';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(380, 356);
      ctx.lineTo(400, 347);
      ctx.lineTo(420, 356);
      ctx.lineTo(415, 380);
      ctx.lineTo(385, 380);
      ctx.closePath();
      ctx.fillStyle = '#1d4055';
      ctx.strokeStyle = '#64dfff';
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(364, 381);
      ctx.lineTo(379, 371);
      ctx.lineTo(389, 395);
      ctx.lineTo(378, 411);
      ctx.moveTo(436, 381);
      ctx.lineTo(421, 371);
      ctx.lineTo(411, 395);
      ctx.lineTo(422, 411);
      ctx.fillStyle = '#758b90';
      ctx.strokeStyle = '#c2d5d9';
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(117, 451);
      ctx.lineTo(268, 437);
      ctx.lineTo(249, 461);
      ctx.lineTo(123, 473);
      ctx.closePath();
      ctx.fillStyle = '#263b48';
      ctx.strokeStyle = '#8ea6ad';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(683, 451);
      ctx.lineTo(532, 437);
      ctx.lineTo(551, 461);
      ctx.lineTo(677, 473);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      drawPart(9, 142, 446, 74, 30);
      drawPart(9, 584, 446, 74, 30);
      drawPart(5, 244, 438, 20, 40);
      drawPart(5, 536, 438, 20, 40);
      drawPart(1, 340, 418, 32, 32);
      drawPart(1, 428, 418, 32, 32);
      drawPart(3, 326, 450, 28, 46);
      drawPart(3, 446, 450, 28, 46);
      drawPart(10, 133, 483, 534, 10);

      const engineGradient = ctx.createLinearGradient(0, 514, 0, 564);
      engineGradient.addColorStop(0, 'rgba(103, 231, 255, 0.85)');
      engineGradient.addColorStop(1, 'rgba(22, 138, 255, 0)');
      ctx.fillStyle = engineGradient;
      ctx.beginPath();
      ctx.moveTo(179, 514);
      ctx.lineTo(200, 514);
      ctx.lineTo(207, 564);
      ctx.lineTo(184, 564);
      ctx.closePath();
      ctx.moveTo(386, 518);
      ctx.lineTo(414, 518);
      ctx.lineTo(424, 564);
      ctx.lineTo(376, 564);
      ctx.closePath();
      ctx.moveTo(600, 514);
      ctx.lineTo(621, 514);
      ctx.lineTo(616, 564);
      ctx.lineTo(593, 564);
      ctx.closePath();
      ctx.fill();
      drawPart(11, 175, 498, 32, 28);
      drawPart(12, 384, 492, 32, 32);
      drawPart(11, 593, 498, 32, 28);

      for (let i = 0; i < DEFENSE_TURRET_LAYOUT.length; i++) {
        const mount = DEFENSE_TURRET_LAYOUT[i];
        ctx.save();
        if (mount.outer) {
          ctx.beginPath();
          ctx.moveTo(mount.x - 28, mount.y + 12);
          ctx.lineTo(mount.x + 28, mount.y + 12);
          ctx.lineTo(mount.x + 35, mount.y + 35);
          ctx.lineTo(mount.x + 42, mount.y + 46);
          ctx.lineTo(mount.x - 42, mount.y + 46);
          ctx.lineTo(mount.x - 35, mount.y + 35);
          ctx.closePath();
          ctx.fillStyle = '#566d77';
          ctx.strokeStyle = '#d0dfe1';
          ctx.lineWidth = 3;
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(mount.x - 22, mount.y + 17);
          ctx.lineTo(mount.x - 33, mount.y + 38);
          ctx.moveTo(mount.x + 22, mount.y + 17);
          ctx.lineTo(mount.x + 33, mount.y + 38);
          ctx.strokeStyle = '#d9e5e6';
          ctx.lineWidth = 5;
          ctx.stroke();
          ctx.fillStyle = '#879b9f';
          ctx.strokeStyle = '#d9e5e6';
          ctx.lineWidth = 2;
          ctx.fillRect(mount.x - 16, mount.y + 18, 32, 22);
          ctx.strokeRect(mount.x - 16, mount.y + 18, 32, 22);
          drawPart(1, mount.x - 12, mount.y + 23, 24, 17);
        } else {
          ctx.beginPath();
          ctx.moveTo(mount.x - 28, mount.y + 6);
          ctx.lineTo(mount.x + 28, mount.y + 6);
          ctx.lineTo(mount.x + 24, mount.y + 24);
          ctx.lineTo(mount.x - 24, mount.y + 24);
          ctx.closePath();
          ctx.fillStyle = '#344c59';
          ctx.strokeStyle = '#b5cbd1';
          ctx.lineWidth = 2;
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#5a7681';
          ctx.fillRect(mount.x - 21, mount.y + 10, 42, 11);
        }

        if (i < autoTurretCount) {
          const coolingDown = now < autoTurretNextFireAt[i];
          ctx.fillStyle = '#7d898c';
          ctx.strokeStyle = '#b0c3c4';
          ctx.lineWidth = 2;
          ctx.fillRect(mount.x - 23, mount.y - 3, 46, 18);
          ctx.strokeRect(mount.x - 23, mount.y - 3, 46, 18);
          if (coolingDown) {
            ctx.filter = 'grayscale(1) brightness(0.68)';
            ctx.fillStyle = '#596b70';
            ctx.fillRect(mount.x - 5, mount.y - 14, 10, 12);
            ctx.fillStyle = '#ffbd54';
            ctx.beginPath();
            ctx.arc(mount.x, mount.y - 10, 3, 0, Math.PI * 2);
            ctx.fill();
          }
          drawPart(13, mount.x - 24, mount.y - 24, 48, 31);
        }
        ctx.restore();
      }
      ctx.restore();

      for (const laser of autoTurretLasers) {
        const target = laser.target;
        const angle = Math.atan2(target.y - laser.y, target.x - laser.x);
        ctx.save();
        ctx.translate(laser.x, laser.y);
        ctx.rotate(angle + Math.PI / 2);
        if (!safeDrawImage(turretLaserImg, -5, -20, 10, 40)) {
          ctx.fillStyle = '#45d8ff';
          ctx.fillRect(-3, -18, 6, 36);
        }
        ctx.restore();
      }

      if (hasRegeneratingShield && defenseShieldActive) {
        const hull = getDefenseShipHullPoints();
        ctx.save();
        ctx.globalAlpha = 0.72 + Math.sin(now * 0.004) * 0.08;
        ctx.beginPath();
        hull.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.clip();
        ctx.filter = 'hue-rotate(155deg) saturate(2.5) brightness(1.25)';
        safeDrawImage(shieldBarrierImg, 0, canvas.height * 0.75, canvas.width, canvas.height * 0.25);
        ctx.filter = 'none';
        ctx.fillStyle = 'rgba(0, 125, 255, 0.34)';
        ctx.beginPath();
        hull.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = '#31caff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00aaff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        hull.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }

    function getBaseMeteorSpawnInterval(currentScore) {
      let baseInterval = 2000;
      if (currentScore < 5000) {
        baseInterval = 2000 - (currentScore / 5000) * 400;
      } else if (currentScore < 25000) {
        baseInterval = 1600 - ((currentScore - 5000) / 20000) * 200;
      } else {
        baseInterval = 1400 - 400 * Math.min(1.0, (currentScore - 25000) / 75000);
      }
      return baseInterval;
    }

    function updateGame(now) {
      defenseShip.x = canvas.width / 2;
      defenseShip.y = canvas.height;
      if (hasRegeneratingShield && !defenseShieldActive && now >= defenseShieldReadyAt) {
        defenseShieldActive = true;
        playSound('shieldUp', 0.6);
      }
      checkPlanetSpawn(now);

      const baseInterval = getBaseMeteorSpawnInterval(score);

      if (meteorBoss && meteorBoss.phase === 'battle') {
        if (now - lastMeteorSpawnTime >= BOSS_METEOR_INTERVAL) {
          spawnMeteor();
          lastMeteorSpawnTime = now;
        }
      } else if (!meteorBoss) {
        let currentSpawnInterval = baseInterval;
        if (activePlanet) {
          currentSpawnInterval = baseInterval * 2.2;
        }

        if (now - lastSpawnTime > currentSpawnInterval) {
          spawnMeteor();
          lastSpawnTime = now;
        }
      }

      if (activePlanet) {
        activePlanet.y += activePlanet.vy;
        activePlanet.rot += activePlanet.rotSpeed;

        ctx.save();
        ctx.translate(activePlanet.x, activePlanet.y);
        ctx.rotate(activePlanet.rot);
        if (!safeDrawImage(activePlanet.img, -activePlanet.radius, -activePlanet.radius, activePlanet.radius * 2, activePlanet.radius * 2)) {
          ctx.fillStyle = '#5533aa';
          ctx.beginPath();
          ctx.arc(0, 0, activePlanet.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        const barW = 220;
        const barH = 10;
        const barX = activePlanet.x - barW / 2;
        const barY = Math.max(15, activePlanet.y - activePlanet.radius + 35);
        drawHpBar(barX, barY, barW, barH, activePlanet.hp, activePlanet.maxHp);

        const planetHitsStation = defenseShipCollidesCircle(activePlanet.x, activePlanet.y, activePlanet.radius);
        if (planetHitsStation || activePlanet.y > canvas.height + activePlanet.radius) {
          applyDefenseShipHit(activePlanet.x, defenseShip.y - canvas.height * 0.05, 2.5, now, true);
          activePlanet = null;
          nextPlanetTime = now + 25000;
        }
      }

      if (meteorBoss) {
        meteorBoss.update(player, meteors, now);
        meteorBoss.draw(ctx);
      }

      for (const m of [...meteors].reverse()) {
        if (!meteors.includes(m)) continue;
        
        if (typeof m.update === 'function') {
          m.update(meteors);
        } else {
          if (m.gravity) {
            m.vy += m.gravity;
          }
          m.x += m.vx;
          m.y += m.vy;
          m.rot += m.rotSpeed;
        }
        if (!meteors.includes(m)) continue;

        if (m.x - m.radius < 0) {
          m.x = m.radius;
          m.vx = Math.abs(m.vx);
        } else if (m.x + m.radius > canvas.width) {
          m.x = canvas.width - m.radius;
          m.vx = -Math.abs(m.vx);
        }

        const hitsDefenseShip = defenseShipCollidesCircle(m.x, m.y, m.radius);
        if (hitsDefenseShip) {
          damageDefenseShip(m, now);
          if (screen === 'gameover') break;
          continue;
        }

        if (m.y > canvas.height + m.radius + 10) {
          meteors.splice(meteors.indexOf(m), 1);
          continue;
        }

        if (typeof m.draw === 'function') {
          m.draw(ctx);
        } else {
          ctx.save();
          ctx.translate(m.x, m.y);
          ctx.rotate(m.rot);

          if (m.isComposite) {
            safeDrawImage(m.bigImg, -30, -30, 60, 60);
            safeDrawImage(m.medImg, 10, -20, 40, 40);
            safeDrawImage(m.smallImg, -20, 10, 28, 28);
          } else {
            if (!safeDrawImage(m.img, -m.radius, -m.radius, m.radius * 2, m.radius * 2)) {
              ctx.fillStyle = '#888';
              ctx.beginPath();
              ctx.arc(0, 0, m.radius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      updateAutoTurrets(now);
      drawDefenseShip(now);
      renderSmoke();
      renderExplosions();

      // Render shot laser trail pulses
      for (let i = laserFlashes.length - 1; i >= 0; i--) {
        const flash = laserFlashes[i];
        flash.life -= 0.15;
        if (flash.life <= 0) {
          laserFlashes.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = flash.life;
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(flash.x, flash.y, flash.r * (2 - flash.life), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Boss Intro Warning Banner
      if (bossIntroBannerTimer > 0) {
        bossIntroBannerTimer--;
        ctx.save();
        const alpha = Math.min(1, bossIntroBannerTimer / 20) * (0.6 + Math.sin(now * 0.02) * 0.4);
        ctx.fillStyle = `rgba(180, 0, 0, ${alpha * 0.35})`;
        ctx.fillRect(0, canvas.height / 2 - 45, canvas.width, 90);

        ctx.strokeStyle = `rgba(255, 60, 0, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.strokeRect(0, canvas.height / 2 - 45, canvas.width, 90);

        ctx.fillStyle = `rgba(255, 230, 0, ${alpha})`;
        ctx.font = '900 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 15;
        ctx.fillText('METEOR TITAN INBOUND', canvas.width / 2, canvas.height / 2);
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('DEFENSE STATION, PREPARE FOR IMPACT', canvas.width / 2, canvas.height / 2 + 25);
        ctx.restore();
      }

      if (meteorBoss && (meteorBoss.phase === 'outro' || meteorBoss.phase === 'victoryDelay')) {
        ctx.save();
        ctx.globalAlpha = 0.65 + Math.sin(now * 0.015) * 0.2;
        ctx.fillStyle = '#ffd66b';
        ctx.font = '900 27px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff6a2b';
        ctx.shadowBlur = 20;
        ctx.fillText(
          meteorBoss.phase === 'outro' ? 'METEOR TITAN DESTROYED' : 'DEFENSE STATION SECURE',
          canvas.width / 2,
          175
        );
        ctx.restore();
      }

      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.y -= 1.2;
        p.life -= 0.025;
        p.alpha = Math.max(0, p.life);

        if (p.life <= 0) {
          popups.splice(i, 1);
          continue;
        }

        drawNumberString(p.scoreStr, p.x, p.y, 0.8, p.alpha);
      }

      ctx.fillStyle = '#00FF88';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 20, 35);

      const currentMult = getCurrentMultiplier();
      if (comboLevel > 0) {
        drawNumberString(`${currentMult.toFixed(1)}x`, 60, 65, 0.7, 1.0);
      }

      drawShieldHUD();
    }

    function update(now) {
      player.x += (targetX - player.x) * 0.90;
      player.y += (targetY - player.y) * 0.90;

      let offsetX = 0;
      let offsetY = 0;
      if (shakeTimer > 0) {
        shakeTimer--;
        offsetX = (Math.random() - 0.5) * shakeIntensity;
        offsetY = (Math.random() - 0.5) * shakeIntensity;
      }

      ctx.save();
      ctx.translate(offsetX, offsetY);

      drawBackground(now);

      if (screen === 'modeSelect') drawModeSelect();
      else if (screen === 'settings') drawSettings();
      else if (screen === 'scores') drawScores();
      else if (screen === 'credits') drawCredits(now);
      else if (screen === 'game') updateGame(now);
      else if (screen === 'upgrades') drawUpgradesScreen();
      else if (screen === 'gameover') drawGameOver();
      else if (screen === 'victory') drawVictory();

      // Render reticle
      const reticleRadius = screen === 'game' || screen === 'upgrades' ? player.radius : 20;
      const reticleSize = reticleRadius * 2.4;
      if (!safeDrawImage(reticleImg, player.x - reticleSize / 2, player.y - reticleSize / 2, reticleSize, reticleSize)) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, reticleRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#00FF88';
        ctx.fill();
      }

      ctx.restore();

      updateScoreEntryAim();
      requestAnimationFrame(update);
    }

    document.getElementById('setupTitle').textContent = 'Connect your phone';
    showConnectionScreen('Scan this QR code with your phone to connect.');
    requestAnimationFrame(update);
  </script>
</body>
