<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteor Fracture - Boss Redesign Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eaf6ff;
      background: radial-gradient(ellipse at 50% 30%, #172139, #080b16 68%, #03040a);
      font: 15px/1.5 system-ui, sans-serif;
    }
    main { width: min(100%, 1000px); }
    h1 { margin: 0 0 6px; font-size: clamp(22px, 4vw, 32px); }
    p { margin: 0 0 16px; color: #afbdce; }
    .frame {
      overflow: hidden;
      border: 1px solid #455a70;
      border-radius: 12px;
      background: #050812;
      box-shadow: 0 18px 70px #000b, 0 0 32px #55caff1c;
    }
    svg { display: block; width: 100%; height: auto; }
    .rock { image-rendering: pixelated; }
  </style>
</head>
<body>
  <main>
    <h1>Meteor Titan - top-anchored redesign preview</h1>
    <p>Preview only; the live boss is unchanged. The head has been raised and narrowed to better match your drawing, while the original arm reach is kept.</p>
    <div class="frame">
      <svg viewBox="0 0 800 600" role="img" aria-label="Boss head built from four large brown meteors, with googly eyes, toothed mouth, and long hanging meteor arms, anchored to the top">
        <defs>
          <radialGradient id="space">
            <stop stop-color="#19223b"/>
            <stop offset="1" stop-color="#050712"/>
          </radialGradient>
          <linearGradient id="bossGlow" x2="0" y2="1">
            <stop stop-color="#ffad66" stop-opacity=".32"/>
            <stop offset="1" stop-color="#f36c36" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-.3" y="-.3" width="1.6" height="1.6">
            <feGaussianBlur stdDeviation="12"/>
          </filter>
        </defs>
        <rect width="800" height="600" fill="url(#space)"/>
        <g fill="#e2efff" opacity=".62">
          <circle cx="56" cy="116" r="1.3"/><circle cx="127" cy="331" r="1"/>
          <circle cx="225" cy="258" r="1.2"/><circle cx="298" cy="365" r="1"/>
          <circle cx="498" cy="294" r="1.2"/><circle cx="608" cy="354" r="1"/>
          <circle cx="704" cy="260" r="1.4"/><circle cx="754" cy="119" r="1"/>
          <circle cx="95" cy="488" r="1"/><circle cx="359" cy="537" r="1.2"/>
          <circle cx="567" cy="505" r="1"/><circle cx="725" cy="461" r="1.1"/>
        </g>
        <text x="24" y="36" fill="#91a9c0" font-size="12" letter-spacing="2">METEOR TITAN / TOP-ANCHORED CONCEPT</text>
        <ellipse cx="400" cy="86" rx="345" ry="118" fill="url(#bossGlow)" filter="url(#glow)"/>

        <!-- The four space meteors form a taller, narrower head that rises into the ceiling. -->
        <image class="rock" href="../assets/meteors/spaceMeteors_001.png" x="200" y="-170" width="250" height="330"/>
        <image class="rock" href="../assets/meteors/spaceMeteors_002.png" x="350" y="-170" width="250" height="330"/>
        <image class="rock" href="../assets/meteors/spaceMeteors_003.png" x="215" y="-12" width="260" height="260"/>
        <image class="rock" href="../assets/meteors/spaceMeteors_004.png" x="325" y="-12" width="260" height="260"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="208" y="24" width="100" height="92" transform="rotate(-23 258 70)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="492" y="24" width="100" height="92" transform="rotate(23 542 70)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="145" y="48" width="120" height="104" transform="rotate(-14 205 100)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="535" y="48" width="120" height="104" transform="rotate(14 595 100)"/>

        <!-- Curved arms use overlapping g2-sized brown meteor pieces rather than a drawn tube. -->
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="54" y="38" width="116" height="100" transform="rotate(-48 112 88)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="20" y="90" width="116" height="100" transform="rotate(-78 78 140)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="26" y="150" width="116" height="100" transform="rotate(-107 84 200)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="65" y="195" width="116" height="100" transform="rotate(-132 123 245)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="622" y="38" width="116" height="100" transform="rotate(48 680 88)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="664" y="90" width="116" height="100" transform="rotate(78 722 140)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="658" y="150" width="116" height="100" transform="rotate(107 716 200)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="619" y="195" width="116" height="100" transform="rotate(132 677 245)"/>

        <!-- Large eyes stay expressive and clear at game scale. -->
        <g>
          <circle cx="338" cy="42" r="38" fill="#3b261d" stroke="#201610" stroke-width="9"/>
          <circle cx="338" cy="42" r="31" fill="#fff"/>
          <image class="rock" href="../assets/eyes/googly-a.png" x="307" y="11" width="62" height="62"/>
          <circle cx="462" cy="54" r="38" fill="#3b261d" stroke="#201610" stroke-width="9"/>
          <circle cx="462" cy="54" r="31" fill="#fff"/>
          <image class="rock" href="../assets/eyes/googly-c.png" x="431" y="23" width="62" height="62"/>
        </g>

        <!-- Mouth uses g2 jaw rocks, a centered g3 stone, and the existing gray meteor teeth. -->
        <image class="rock" href="../assets/meteors/meteorBrown_med1.png" x="291" y="97" width="94" height="78" transform="rotate(-7 338 136)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_med3.png" x="415" y="97" width="94" height="78" transform="rotate(7 462 136)"/>
        <ellipse cx="400" cy="144" rx="86" ry="22" fill="#160e11" stroke="#403333" stroke-width="4"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big1.png" x="373" y="125" width="54" height="43"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med1.png" x="329" y="118" width="22" height="24"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med2.png" x="360" y="118" width="22" height="24"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med1.png" x="391" y="118" width="22" height="24"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med2.png" x="422" y="118" width="22" height="24"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med1.png" x="453" y="118" width="22" height="24"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med2.png" x="346" y="146" width="23" height="25" transform="rotate(180 357 158)"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med1.png" x="378" y="146" width="23" height="25" transform="rotate(180 389 158)"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med2.png" x="410" y="146" width="23" height="25" transform="rotate(180 421 158)"/>
        <image class="rock" href="../assets/meteors/meteorGrey_med1.png" x="442" y="146" width="23" height="25" transform="rotate(180 453 158)"/>

        <!-- Hands are built from large g4/g3 rocks; small g1 stones form the fingertips. -->
        <image class="rock" href="../assets/meteors/meteorBrown_big4.png" x="46" y="224" width="132" height="110" transform="rotate(-22 112 279)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big3.png" x="84" y="250" width="116" height="96" transform="rotate(19 142 298)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big1.png" x="9" y="228" width="76" height="68" transform="rotate(-31 47 262)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big2.png" x="74" y="292" width="74" height="64" transform="rotate(13 111 324)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big4.png" x="622" y="224" width="132" height="110" transform="rotate(22 688 279)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big3.png" x="600" y="250" width="116" height="96" transform="rotate(-19 658 298)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big1.png" x="715" y="228" width="76" height="68" transform="rotate(31 753 262)"/>
        <image class="rock" href="../assets/meteors/meteorBrown_big2.png" x="652" y="292" width="74" height="64" transform="rotate(-13 689 324)"/>

        <text x="400" y="570" fill="#8ea7c0" font-size="12" text-anchor="middle" letter-spacing="1.3">CONCEPT PREVIEW — LIVE BOSS NOT CHANGED</text>
      </svg>
    </div>
  </main>
</body>
</html>
